<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%" fill="none" role="img" aria-label="HKHC Christian Community Fellowship Illustration">
  <defs>
    <!-- Soft Gradients for Ambient Warmth -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eff6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fefce8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="crossGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="280" cy="190" r="170" fill="url(#bgGlow)"/>
  <circle cx="280" cy="85" r="50" fill="url(#crossGlow)" filter="url(#subtleGlow)"/>
  <circle cx="430" cy="110" r="28" fill="#fef3c7" opacity="0.6"/>
  <circle cx="130" cy="130" r="22" fill="#ccfbf1" opacity="0.7"/>

  <!-- Subtle Church Cross of Grace in Background Center -->
  <g opacity="0.28">
    <rect x="276" y="55" width="8" height="65" rx="4" fill="#0d9488"/>
    <rect x="264" y="70" width="32" height="8" rx="4" fill="#0d9488"/>
  </g>

  <!-- Gentle Ray/Aura of Light from Cross -->
  <path d="M260 90 L160 280 L400 280 Z" fill="url(#bgGlow)" opacity="0.4"/>

  <!-- Botanical Leaves of Peace & Healing (Left & Right) -->
  <g opacity="0.45">
    <!-- Left foliage -->
    <path d="M85 280 C95 240, 120 230, 140 245 C120 260, 105 285, 85 280 Z" fill="#14b8a6"/>
    <path d="M100 295 C115 265, 145 265, 155 285 C135 295, 115 305, 100 295 Z" fill="#0d9488"/>
    <!-- Right foliage -->
    <path d="M475 280 C465 240, 440 230, 420 245 C440 260, 455 285, 475 280 Z" fill="#14b8a6"/>
    <path d="M460 295 C445 265, 415 265, 405 285 C425 295, 445 305, 460 295 Z" fill="#0d9488"/>
  </g>

  <!-- Fellowship Table / Center Platform -->
  <ellipse cx="280" cy="285" rx="145" ry="32" fill="#e2e8f0" opacity="0.7" filter="url(#softShadow)"/>
  <ellipse cx="280" cy="282" rx="135" ry="24" fill="#ffffff"/>

  <!-- Open Bible / Scriptures on Center Table -->
  <g filter="url(#softShadow)">
    <!-- Book Stand / Base -->
    <path d="M265 278 L295 278 L292 284 L268 284 Z" fill="#94a3b8"/>
    <!-- Left Page -->
    <path d="M280 266 C262 263, 248 268, 245 278 C258 274, 272 272, 280 274 Z" fill="#f8fafc"/>
    <path d="M280 266 C262 263, 248 268, 245 278" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Right Page -->
    <path d="M280 266 C298 263, 312 268, 315 278 C302 274, 288 272, 280 274 Z" fill="#ffffff"/>
    <path d="M280 266 C298 263, 312 268, 315 278" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Scripture text hint lines -->
    <line x1="253" y1="270" x2="274" y2="269" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="252" y1="273" x2="273" y2="272" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="286" y1="269" x2="307" y2="270" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <line x1="287" y1="272" x2="308" y2="273" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
    <!-- Center Ribbon Bookmark -->
    <path d="M280 266 L280 281 L278 284 L282 284 Z" fill="#e11d48"/>
  </g>

  <!-- Small Warm Candle / Lamp next to Scripture -->
  <g>
    <rect x="325" y="268" width="10" height="12" rx="2" fill="#e2e8f0"/>
    <ellipse cx="330" cy="265" rx="3.5" ry="5.5" fill="url(#amberGrad)" filter="url(#subtleGlow)"/>
  </g>

  <!-- =========================================================================
       COMMUNITY FIGURES (AVATARS IN FELLOWSHIP)
       ========================================================================= -->

  <!-- FIGURE 1: Youth / Teen Member (Left - Listening & Inquiring) -->
  <g filter="url(#softShadow)">
    <!-- Shadow -->
    <ellipse cx="195" cy="286" rx="28" ry="8" fill="#cbd5e1" opacity="0.6"/>
    <!-- Body / Torso (Teal Jacket/Top) -->
    <path d="M172 232 C172 215, 218 215, 218 232 L224 282 L166 282 Z" fill="url(#tealGrad)"/>
    <!-- Collar / Shirt Detail -->
    <path d="M188 220 L195 234 L202 220 Z" fill="#ffffff"/>
    <!-- Head / Neck -->
    <rect x="191" y="210" width="8" height="12" fill="#d4a373" rx="3"/>
    <ellipse cx="195" cy="196" rx="15" ry="17" fill="#e0a96d"/>
    <!-- Hair (Youthful modern style) -->
    <path d="M180 196 C180 182, 192 178, 208 181 C212 186, 212 196, 210 200 C204 191, 190 191, 180 196 Z" fill="#1e293b"/>
    <!-- Hands holding notebook/journal -->
    <rect x="186" y="246" width="20" height="15" rx="3" fill="#f8fafc" transform="rotate(-6 186 246)"/>
    <ellipse cx="184" cy="254" rx="4" ry="4" fill="#e0a96d"/>
    <ellipse cx="206" cy="252" rx="4" ry="4" fill="#e0a96d"/>
  </g>

  <!-- FIGURE 2: Pastor / Discussion Leader / Adult (Center - Speaking Grace) -->
  <g filter="url(#softShadow)">
    <!-- Shadow -->
    <ellipse cx="280" cy="265" rx="32" ry="9" fill="#cbd5e1" opacity="0.7"/>
    <!-- Body / Torso (Navy / Slate Blue Dignified Robe/Jacket) -->
    <path d="M252 195 C252 175, 308 175, 308 195 L314 255 L246 255 Z" fill="url(#slateGrad)"/>
    <!-- Warm Stole / Scarf of Fellowship -->
    <path d="M266 186 Q280 215 272 245" stroke="url(#amberGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M294 186 Q280 215 288 245" stroke="url(#amberGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Inner White Shirt -->
    <path d="M273 182 L280 198 L287 182 Z" fill="#ffffff"/>
    <!-- Head / Neck -->
    <rect x="276" y="172" width="8" height="12" fill="#c68642" rx="3"/>
    <ellipse cx="280" cy="158" rx="16" ry="18" fill="#c68642"/>
    <!-- Hair (Neat classic cut) -->
    <path d="M264 158 C264 142, 296 142, 296 158 C290 149, 270 149, 264 158 Z" fill="#0f172a"/>
    <!-- Hands in welcoming gesture of fellowship -->
    <circle cx="258" cy="225" r="4.5" fill="#c68642"/>
    <circle cx="302" cy="225" r="4.5" fill="#c68642"/>
  </g>

  <!-- FIGURE 3: Elder / Caring Sister / Encourager (Right - Thoughtful & Loving) -->
  <g filter="url(#softShadow)">
    <!-- Shadow -->
    <ellipse cx="365" cy="286" rx="28" ry="8" fill="#cbd5e1" opacity="0.6"/>
    <!-- Body / Torso (Warm Indigo / Royal Blue Dress) -->
    <path d="M342 232 C342 215, 388 215, 388 232 L394 282 L336 282 Z" fill="url(#indigoGrad)"/>
    <!-- Warm Shawl Accent -->
    <path d="M346 226 C360 240, 370 240, 384 226 L388 248 C372 260, 358 260, 342 248 Z" fill="#93c5fd" opacity="0.85"/>
    <!-- Head / Neck -->
    <rect x="361" y="210" width="8" height="12" fill="#8d5524" rx="3"/>
    <ellipse cx="365" cy="196" rx="15" ry="17" fill="#8d5524"/>
    <!-- Hair / Graceful Headwrap -->
    <path d="M350 196 C350 178, 380 178, 380 196 C378 184, 352 184, 350 196 Z" fill="#312e81"/>
    <!-- Hands resting calmly in prayer -->
    <ellipse cx="365" cy="254" rx="6" ry="4.5" fill="#8d5524"/>
  </g>

  <!-- =========================================================================
       SUBTLE, UPLIFTING DIALOGUE BUBBLES (HONEST QUESTIONS & GRACEFUL ANSWERS)
       ========================================================================= -->

  <!-- Bubble 1: Heart of Love & Acceptance (Above Left Figure) -->
  <g filter="url(#softShadow)">
    <rect x="145" y="118" width="48" height="34" rx="10" fill="#ffffff"/>
    <path d="M165 152 L172 160 L173 152 Z" fill="#ffffff"/>
    <!-- Red/Pink Heart Icon -->
    <path d="M169 135 C169 131, 164 128, 161 131 C158 128, 153 131, 153 135 C153 140, 161 144, 161 146 C161 144, 169 140, 169 135 Z" fill="#f43f5e"/>
    <!-- Small dots -->
    <circle cx="176" cy="135" r="1.8" fill="#cbd5e1"/>
    <circle cx="182" cy="135" r="1.8" fill="#cbd5e1"/>
  </g>

  <!-- Bubble 2: Light Bulb & Cross of Wisdom (Above Center Leader) -->
  <g filter="url(#softShadow)">
    <rect x="252" y="98" width="56" height="36" rx="12" fill="#ffffff"/>
    <path d="M280 134 L280 142 L286 134 Z" fill="#ffffff"/>
    <!-- Small Bible Cross in Bubble -->
    <rect x="278" y="108" width="4" height="16" rx="1.5" fill="#0d9488"/>
    <rect x="272" y="112" width="16" height="4" rx="1.5" fill="#0d9488"/>
  </g>

  <!-- Bubble 3: Gentle Peace & Encouraging Question (Above Right Figure) -->
  <g filter="url(#softShadow)">
    <rect x="368" y="118" width="54" height="34" rx="10" fill="#ffffff"/>
    <path d="M386 152 L384 160 L392 152 Z" fill="#ffffff"/>
    <!-- Prayer Hands / Peace Olive Branch -->
    <path d="M388 136 C393 132, 400 132, 404 135 C399 137, 393 137, 388 136 Z" fill="#14b8a6"/>
    <path d="M394 136 C397 130, 404 130, 407 133 C403 135, 398 135, 394 136 Z" fill="#0d9488"/>
    <!-- Question & Smile Accent -->
    <circle cx="380" cy="135" r="2" fill="#f59e0b"/>
  </g>

  <!-- Gentle Floating Sparkles of Hope -->
  <g fill="#fbbf24" opacity="0.75">
    <path d="M125 180 Q130 180 130 175 Q130 180 135 180 Q130 180 130 185 Q130 180 125 180 Z"/>
    <path d="M435 165 Q439 165 439 161 Q439 165 443 165 Q439 165 439 169 Q439 165 435 165 Z"/>
    <path d="M335 85 Q338 85 338 82 Q338 85 341 85 Q338 85 338 88 Q338 85 335 85 Z"/>
  </g>
</svg>
