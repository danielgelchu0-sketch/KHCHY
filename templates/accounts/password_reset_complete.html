{% extends "base.html" %}

{% block title %}Password Reset Complete | {{ COMMUNITY_NAME }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px;">
  <div class="card text-center" style="padding: 2.5rem 2rem;">
    <h2>Password Successfully Reset</h2>
    <p class="text-muted" style="margin-top: 1rem;">
      Your password has been changed. You may now sign in using your new credentials.
    </p>
    <div style="margin-top: 2rem;">
      <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
