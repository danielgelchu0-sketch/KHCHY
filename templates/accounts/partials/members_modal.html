{% load i18n static %}

<!-- Interactive Registered Members Directory Modal -->
<div id="community-members-modal" class="share-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="members-modal-title">
  <div class="members-modal-card">
    <div class="members-modal-header">
      <div class="members-modal-title-wrap">
        <span class="members-modal-header-icon" aria-hidden="true">👥</span>
        <div>
          <h3 id="members-modal-title" class="members-modal-title">
            {% trans "Community Members" %}
          </h3>
          <span class="members-modal-subtitle">
            <strong class="js-total-members-count">{{ total_registered_members }}</strong> {% trans "registered members in community" %}
          </span>
        </div>
      </div>
      <button type="button" class="share-modal-close-btn js-close-members-modal" aria-label="{% trans 'Close' %}">&times;</button>
    </div>

    <!-- Live Search Filter Input -->
    <div class="members-search-container">
      <div class="members-search-input-wrap">
        <svg class="members-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="search" id="members-modal-search" class="members-search-input"
               placeholder="{% trans 'Search members by name...' %}"
               aria-label="{% trans 'Search members' %}" autocomplete="off">
        <button type="button" id="members-search-clear" class="members-search-clear hidden" aria-label="{% trans 'Clear search' %}">&times;</button>
      </div>
    </div>

    <!-- Scrollable Member List Container -->
    <div id="members-modal-list" class="members-modal-list" role="list" aria-live="polite">
      <!-- Loading Skeleton (Initial state before fetch) -->
      <div class="members-loading-state">
        <div class="members-loading-spinner" aria-hidden="true"></div>
        <span>{% trans "Loading members..." %}</span>
      </div>
    </div>

    <!-- Privacy & Safe Fellowship Footnote -->
    <div class="members-modal-footer">
      <div class="members-privacy-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
        <span>{% trans "Emails and private anonymous posts are strictly confidential and protected." %}</span>
      </div>
      <a href="{% url 'accounts:member_directory' %}" class="members-view-all-link">
        {% trans "All members" %} &rarr;
      </a>
    </div>
  </div>
</div>
